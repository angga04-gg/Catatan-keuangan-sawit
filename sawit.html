<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Kelapa Sawit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://via.placeholder.com/192x192.png?text=KS" type="image/png">
    <meta name="theme-color" content="#16a34a">
    <meta name="description" content="Aplikasi catatan keuangan untuk usaha kelapa sawit">
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-6 text-green-800">Keuangan Kelapa Sawit</h1>

        <!-- Form Input -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Tambah Transaksi</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Jenis Transaksi</label>
                    <select id="transactionType" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                        <option value="Pemasukkan">Pemasukkan</option>
                        <option value="Pengeluaran">Pengeluaran</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Kategori</label>
                    <select id="category" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500">
                        <option value="Penjualan TBS">Penjualan TBS</option>
                        <option value="Pupuk">Pupuk</option>
                        <option value="Upah Pekerja">Upah Pekerja</option>
                        <option value="Pemeliharaan Kebun">Pemeliharaan Kebun</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Jumlah (Rp)</label>
                    <input type="number" id="amount" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="Masukkan jumlah" min="1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Keterangan</label>
                    <input type="text" id="description" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-green-500 focus:border-green-500" placeholder="Masukkan keterangan">
                </div>
            </div>
            <button onclick="addTransaction()" class="mt-4 w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 transition">Tambah Transaksi</button>
        </div>

        <!-- Ringkasan -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Ringkasan Keuangan</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="text-center p-4 bg-green-50 rounded-md">
                    <p class="text-sm text-gray-600">Total Pemasukkan</p>
                    <p id="totalIncome" class="text-lg font-bold text-green-600">Rp 0</p>
                </div>
                <div class="text-center p-4 bg-red-50 rounded-md">
                    <p class="text-sm text-gray-600">Total Pengeluaran</p>
                    <p id="totalExpense" class="text-lg font-bold text-red-600">Rp 0</p>
                </div>
                <div class="text-center p-4 bg-blue-50 rounded-md">
                    <p class="text-sm text-gray-600">Saldo</p>
                    <p id="balance" class="text-lg font-bold">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Tabel Transaksi -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Daftar Transaksi</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-3 text-sm font-semibold">Tanggal</th>
                            <th class="p-3 text-sm font-semibold">Jenis</th>
                            <th class="p-3 text-sm font-semibold">Kategori</th>
                            <th class="p-3 text-sm font-semibold">Jumlah</th>
                            <th class="p-3 text-sm font-semibold">Keterangan</th>
                            <th class="p-3 text-sm font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function addTransaction() {
            const type = document.getElementById('transactionType').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value.trim();

            if (!amount || amount <= 0) {
                showToast('Masukkan jumlah yang valid!', 'error');
                return;
            }

            const transaction = {
                id: Date.now(),
                date: new Date().toLocaleDateString('id-ID'),
                type,
                category,
                amount,
                description
            };

            transactions.push(transaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            updateTable();
            updateSummary();
            clearForm();
            showToast('Transaksi berhasil ditambahkan!', 'success');
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            updateTable();
            updateSummary();
            showToast('Transaksi dihapus!', 'success');
        }

        function updateTable() {
            const tableBody = document.getElementById('transactionTable');
            tableBody.innerHTML = '';

            transactions.forEach(t => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-3">${t.date}</td>
                    <td class="p-3">${t.type}</td>
                    <td class="p-3">${t.category}</td>
                    <td class="p-3 ${t.type === 'Pemasukkan' ? 'text-green-600' : 'text-red-600'}">
                        Rp ${t.amount.toLocaleString('id-ID')}
                    </td>
                    <td class="p-3">${t.description || '-'}</td>
                    <td class="p-3">
                        <button onclick="deleteTransaction(${t.id})" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700 transition">Hapus</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateSummary() {
            const totalIncome = transactions
                .filter(t => t.type === 'Pemasukkan')
                .reduce((sum, t) => sum + t.amount, 0);
            const totalExpense = transactions
                .filter(t => t.type === 'Pengeluaran')
                .reduce((sum, t) => sum + t.amount, 0);
            const balance = totalIncome - totalExpense;

            document.getElementById('totalIncome').textContent = `Rp ${totalIncome.toLocaleString('id-ID')}`;
            document.getElementById('totalExpense').textContent = `Rp ${totalExpense.toLocaleString('id-ID')}`;
            document.getElementById('balance').textContent = `Rp ${balance.toLocaleString('id-ID')}`;
            document.getElementById('balance').className = `text-lg font-bold ${balance >= 0 ? 'text-green-600' : 'text-red-600'}`;
        }

        function clearForm() {
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 p-4 rounded-md shadow-lg text-white ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // Initialize
        updateTable();
        updateSummary();
    </script>
</body>
</html>
